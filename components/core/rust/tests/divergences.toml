[[divergence]]
id = "DV-31"
summary = "Corruption aborts or segfaults -> typed errors"
classifier = "dedicated-test"
recognition = "A mutated archive crashes C++; Rust returns CorruptArchive. Every scan, x included, validates the log_event_idx node, so an archive whose log_event_idx node is retyped to a non-integer type also fails Rust x with CorruptArchive (exit 2) where C++ x, which never reads that column, exits 0."
checked_by = "clp-s-format, clp-s-table unit tests; clp-s-table mutations::retyped_log_event_idx_nodes_are_a_registered_divergence_from_cpp"

[[divergence]]
id = "DV-32"
