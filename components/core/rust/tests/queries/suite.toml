# Query suite of the Rust clp-s reader prototype (hand-written).
#
# Every [[query]] runs through the C++ `clp-s s` (oracles generated by scripts/gen-oracles.sh into
# tests/queries/oracles/, manifest in tests/queries/oracles/manifest.toml) and through the Rust
# reader; results are compared as canonicalized multisets (tests/README.md).
#
# Fields:
#   id                   unique id; also the oracle file stem.
#   target               a fixture name from tests/fixtures/fixtures.toml (all of its archives,
#                        searched as one session) or `dataset:<name>`.
#   kql                  the KQL text, passed verbatim as one argv element.
#   ignore_case          `-i`.
#   tge / tle            `--tge` / `--tle`, epoch ms.
#   projection           `--projection` columns.
#   outputs              any of "stdout" (default), "msgpack" (`file --path`), "results-cache".
#   max_num_results      results-cache `--max-num-results` (default 10).
#   divergence           registered divergences (design report §8.3) that make the C++ oracle differ from
#                        the expected Rust result.
#   expected_rust_ids    for a divergent fixture query: the ids (`rid`/`kid`/`id` field) of the
#                        records the Rust reader must return instead of the C++ oracle.
#   expected_rust_count  the same for a dataset query.
#   note                 why the query exists, or how the expectation was derived.
#
# Queries without `divergence` must match the C++ oracle exactly. The expected Rust results were
# derived from design report §8.1 with the independent model in scripts/reference_eval.py, which
# gen-oracles.sh re-runs against every fixture query (reported as `reference_*` in the manifest).

# Datasets: `archive` is relative to PROTO_DATA_ROOT. `inputs`/`inputs_from` (a file listing the
# inputs, one per line) may name environment variables, which scripts/corpus.py expands; see
# tests/README.md.

[[dataset]]
name = "bench"
inputs = ["$PROTO_BENCH_JSONL"]
timestamp_key = "timestamp"
archive = "datasets/bench.clps"

[[dataset]]
name = "spider"
inputs_from = "$PROTO_SPIDER_FILE_LIST"
timestamp_key = "timestamp"
archive = "datasets/spider.clps"

[[dataset]]
name = "synthetic"
inputs = ["$PROTO_SYNTHETIC_JSONL"]
timestamp_key = "ts"
archive = "datasets/synthetic.clps"

# Equality on every type (search.ts unless stated).

[[query]]
id = "eq-int"
target = "search.ts"
kql = 'n: 5'
note = "Integer column, plus the VarString \"5\" of r37 (an integer literal matches the exact text)."

[[query]]
id = "eq-int-zero"
target = "search.ts"
kql = 'n: 0'

[[query]]
id = "eq-int-neg"
target = "search.ts"
