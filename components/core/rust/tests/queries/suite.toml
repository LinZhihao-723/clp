# Ranges on ints, floats and timestamps.

[[query]]
id = "range-int-gt"
target = "search.ts"
kql = 'n > 10'

[[query]]
id = "range-int-gte"
target = "search.ts"
kql = 'n >= 10'

[[query]]
id = "range-int-lt"
target = "search.ts"
kql = 'n < 0'

[[query]]
id = "range-int-lte"
target = "search.ts"
kql = 'n <= 0'

[[query]]
id = "range-int-near-max"
target = "search.ts"
kql = 'n > 9223372036854775806'

[[query]]
id = "range-int-near-min"
target = "search.ts"
kql = 'n < -9223372036854775807'

[[query]]
id = "range-int-float-literal-gt"
target = "search.ts"
kql = 'n > 2.5'

[[query]]
id = "range-int-float-literal-lt"
target = "search.ts"
kql = 'n < 3.5'

[[query]]
id = "range-float-gt"
target = "search.ts"
kql = 'f > 5'

[[query]]
id = "range-float-lt"
target = "search.ts"
kql = 'f < 0'

[[query]]
id = "range-float-gte-exp"
target = "search.ts"
kql = 'f >= 1e10'

[[query]]
id = "range-float-gt-int-literal"
target = "search.ts"
kql = 'f > 3'

[[query]]
id = "range-float-lte-neg"
target = "search.ts"
kql = 'f <= -0.5'

[[query]]
id = "range-float-huge-literal"
target = "search.ts"
kql = 'f > 1.7e308'
divergence = ["DV-14"]
expected_rust_ids = ["r11"]
note = "C++ casts 1.7e308 to int64 for r38's Integer f (undefined behaviour) and matches it."

[[query]]
id = "range-poly"
target = "search.ts"
kql = 'p > 0'
note = "r25's array [25, \"x\"] matches both ways: C++ through `!=`, Rust through the typed element 25."

[[query]]
id = "range-poly-lt"
target = "search.ts"
kql = 'p < 20'
divergence = ["DV-11"]
expected_rust_ids = ["r18", "r19"]
note = "C++ evaluates the range on r25's array as `!=`."

[[query]]
id = "range-text-column"
target = "search.ts"
kql = 'level > 1'
note = "Range on a text-only column: no comparable value, no match."

[[query]]
id = "range-ts-gt"
target = "search.ts"
kql = 'ts > 1700000035000'
divergence = ["DV-15"]
expected_rust_ids = ["r36", "r37", "r38", "r39"]
note = "C++ compares the integer literal with the ns row value; Rust uses epoch ms (D11)."

[[query]]
id = "range-ts-gte"
target = "search.ts"
kql = 'ts >= 1700000035000'
divergence = ["DV-15"]
expected_rust_ids = ["r35", "r36", "r37", "r38", "r39"]

[[query]]
id = "range-ts-lt"
target = "search.ts"
kql = 'ts < 1700000002000'
divergence = ["DV-15"]
expected_rust_ids = ["r00", "r01"]

[[query]]
id = "eq-ts"
target = "search.ts"
kql = 'ts: 1700000003000'
divergence = ["DV-15"]
expected_rust_ids = ["r03"]

[[query]]
id = "range-ts-string-column"
target = "timestamps-string.ts"
kql = 'ts > 1700000030000'
divergence = ["DV-15"]
expected_rust_ids = [13, 16]

[[query]]
id = "range-ts-int-precisions"
target = "timestamps-int.ts"
kql = 'ts > 1700000003000'
divergence = ["DV-15"]
expected_rust_ids = [3, 4, 10, 11, 13]
note = "Mixed s/ms/us/ns precisions, all normalized to ns at ingestion."

[[query]]
id = "range-ts-not-authoritative"
target = "timestamps-int.default"
kql = 'ts > 1700000003000'
note = "Without --timestamp-key the column is a plain Integer: raw values compare."

# ClpString and VarString wildcards.

[[query]]
id = "clp-substr"
target = "search.ts"
kql = 'msg: "*logged in*"'

[[query]]
id = "clp-no-wildcard-substring"
target = "search.ts"
kql = 'msg: "logged in"'
note = "No wildcard: whole-value match, no substring semantics."

[[query]]
id = "clp-question-one-char"
target = "search.ts"
kql = 'msg: "user ? logged*"'
divergence = ["DV-17"]
expected_rust_ids = []
note = "`?` is exactly one byte; GrepCore matches the two-digit 42/43."

[[query]]
id = "clp-question-digit"
target = "search.ts"
kql = 'msg: "user 4? logged*"'

[[query]]
id = "clp-escaped-star"
target = "search.ts"
kql = 'msg: "*\* star*"'

[[query]]
id = "clp-escaped-question"
target = "search.ts"
kql = 'msg: "*\?*"'

[[query]]
id = "clp-escaped-backslash"
target = "search.ts"
kql = 'msg: "*back\\slash*"'

[[query]]
id = "clp-escaped-quote"
target = "search.ts"
kql = 'msg: "*\"*"'

[[query]]
id = "clp-unicode-substr"
target = "search.ts"
kql = 'msg: "*café*"'

[[query]]
id = "clp-unicode-escape"
target = "search.ts"
kql = 'msg: "*\u00e9*"'

[[query]]
id = "clp-unquoted-wildcard"
target = "search.ts"
kql = 'msg: *failed*'

[[query]]
id = "clp-suffix"
target = "search.ts"
kql = 'msg: *500'

[[query]]
id = "clp-inner-wildcards"
target = "search.ts"
kql = 'msg: "request * failed with status 50?"'

[[query]]
id = "clp-inner-star-span"
target = "search.ts"
kql = 'msg: "user 4*ged in*"'
divergence = ["DV-17"]
expected_rust_ids = ["r00"]
note = "The token `4*ged` spans the integer 42 and the dictionary word `logged`; GrepCore requires one dictionary variable."

[[query]]
id = "clp-inner-star-numbers"
target = "search.ts"
kql = 'msg: "*ratio 0*93"'
divergence = ["DV-17"]
expected_rust_ids = ["r03"]
note = "The token `0*93` lies inside the float 0.93; GrepCore never tries it as a float variable."

[[query]]
id = "clp-question-spans-delimiter"
target = "search.ts"
kql = 'msg: "*7?faile*"'
divergence = ["DV-17"]
expected_rust_ids = ["r02"]
note = "The `?` matches the space between the integer 7 and `failed`, so the token spans two message tokens."

[[query]]
id = "clp-edge-star-float"
target = "search.ts"
kql = 'msg: "*0.*"'
divergence = ["DV-17"]
expected_rust_ids = ["r00", "r03"]
note = "`0.` is not encodable, so GrepCore does not try `*0.*` as a float variable and misses 0.93."

[[query]]
id = "clp-edge-star-float-prefix"
target = "search.ts"
kql = 'msg: "*91.*"'
divergence = ["DV-17"]
expected_rust_ids = ["r01"]
note = "As clp-edge-star-float, on the float 91.5."

[[query]]
id = "clp-backslash-before-star"
target = "search.ts"
kql = 'msg: "back\\*"'
divergence = ["DV-17"]
expected_rust_ids = ["r09"]
note = "A literal backslash before `*`: GrepCore drops its escape in the logtype pattern, which then matches no logtype."

[[query]]
id = "clp-backslash-before-inner-star"
target = "search.ts"
kql = 'msg: "*path C:\\*"'
divergence = ["DV-17"]
expected_rust_ids = ["r09"]
note = "As clp-backslash-before-star, after a space."

[[query]]
id = "var-prefix"
target = "search.ts"
kql = 'level: ERR*'

[[query]]
id = "var-suffix-both-encodings"
target = "search.ts"
kql = 'level: *ERROR'
note = "Matches the VarString ERROR and the ClpString \"FATAL ERROR\"."

[[query]]
id = "var-question"
target = "search.ts"
