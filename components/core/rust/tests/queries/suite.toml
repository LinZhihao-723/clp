kql = 'msg: "disk usage at 91.5 percent"'

[[query]]
id = "eq-clp-level"
target = "search.ts"
kql = 'level: "FATAL ERROR"'

[[query]]
id = "eq-clp-unicode"
target = "search.ts"
kql = 'msg: "unicode café 中文 message"'

[[query]]
id = "eq-clp-escaped-quote"
target = "search.ts"
kql = 'msg: "quote \" inside msg"'

[[query]]
id = "eq-clp-backslash"
target = "search.ts"
kql = 'msg: "back\\slash path C:\\tmp\\x"'

[[query]]
id = "eq-clp-control-escapes"
target = "search.ts"
kql = 'msg: "tab\tand newline\n in msg"'
note = "KQL \\t and \\n escapes."

[[query]]
