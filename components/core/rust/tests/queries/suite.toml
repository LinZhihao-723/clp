kql = 'f: -2.25'

[[query]]
id = "eq-float-exp"
target = "search.ts"
kql = 'f: 1e10'

[[query]]
id = "eq-float-as-int-literal"
target = "search.ts"
kql = 'f: 10000000000'

[[query]]
id = "eq-float-max"
target = "search.ts"
kql = 'f: 1.7976931348623157e308'

[[query]]
id = "eq-bool-true"
target = "search.ts"
