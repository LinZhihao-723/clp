expected_rust_ids = [0]
note = "Rust reaches the object a itself (DV-19) and the leaf a.\"\".b; C++ reaches neither."

[[query]]
id = "empty-key-wildcard-literal"
target = "empty-key-wildcard.default"
kql = 'a.b: 2'
divergence = ["DV-16"]
expected_rust_ids = []
note = "C++ reaches a.\"\".b through empty-key transparency."

[[query]]
id = "empty-key-order-literal"
target = "empty-key-order.default"
kql = 'a.b: 1'
note = "Node a.b precedes a.\"\".b, so C++ binds a.b to it: agrees with Rust in this order only."

[[query]]
id = "empty-key-order-literal-below-empty-key"
target = "empty-key-order.default"
kql = 'a.b: 2'

[[query]]
id = "empty-key-order-wildcard"
target = "empty-key-order.default"
kql = '*.b: 2'
divergence = ["DV-39"]
expected_rust_ids = [0]
note = "*.b binds a.b and a.\"\".b of id 0's schema; C++ searches only a.b, the smaller node id."

[[query]]
id = "empty-key-order-partial-wildcard"
target = "empty-key-order.default"
kql = 'a.*.b: 2'
divergence = ["DV-39"]
expected_rust_ids = [0]

[[query]]
id = "empty-key-order-reversed-literal"
target = "empty-key-order-reversed.default"
kql = 'a.b: 1'
divergence = ["DV-16", "DV-39"]
expected_rust_ids = [0]
note = "Node a.\"\".b now precedes a.b; C++ binds a.b to both through empty-key transparency, searches only a.\"\".b and loses id 0."

[[query]]
id = "empty-key-order-reversed-literal-below-empty-key"
target = "empty-key-order-reversed.default"
kql = 'a.b: 2'
divergence = ["DV-16", "DV-39"]
expected_rust_ids = []

[[query]]
id = "empty-key-order-reversed-wildcard"
target = "empty-key-order-reversed.default"
kql = '*.b: 2'
note = "C++ binds a.\"\".b first in this order, so it agrees with Rust."

[[query]]
id = "time-escaped-key-eq"
target = "timestamps-escaped-key.ts-escaped"
kql = 't\*s: 1700000001000'
divergence = ["DV-15"]
expected_rust_ids = [1]
note = "The timestamp key contains a `*`: C++ compares its half-escaped stored tokens with the unescaped column and loses timestamp-index pruning (DV-18, results unchanged); Rust binds the index by node id."

[[query]]
id = "time-escaped-key-tge"
target = "timestamps-escaped-key.ts-escaped"
kql = '*'
tge = 1700000001000

[[query]]
id = "time-escaped-key-tle"
target = "timestamps-escaped-key.ts-escaped"
kql = '*'
tle = 1700000001000

[[query]]
id = "time-escaped-key-gt-disjoint"
target = "timestamps-escaped-key.ts-escaped"
kql = 't\*s > 1800000000000'
divergence = ["DV-15"]
expected_rust_ids = []
note = "C++ loses the timestamp-index pruning on the escaped key (DV-18), so its ns row-level comparison (DV-15) returns every record; with an unescaped key the index prunes and C++ returns nothing."

[[query]]
id = "time-escaped-key-lt-covering"
target = "timestamps-escaped-key.ts-escaped"
kql = 't\*s < 1800000000000'
divergence = ["DV-15"]
expected_rust_ids = [0, 1, 2]

# Wire outputs: msgpack file output and the results cache (top-k, --max-num-results 10).

[[query]]
id = "wire-msgpack-search"
target = "search.ts"
kql = 'level: WARN'
outputs = ["msgpack"]

[[query]]
id = "wire-msgpack-nolog"
target = "search.ts-nolog"
kql = 'b: true'
outputs = ["msgpack"]
note = "Without log order: the tuple's log_event_idx is not recorded."

[[query]]
id = "wire-msgpack-kvir"
target = "kvir-text.ts"
kql = '*'
outputs = ["msgpack"]

[[query]]
id = "wire-msgpack-split"
target = "logs.ts-split"
kql = 'level: ERROR AND service: auth'
outputs = ["msgpack"]
divergence = ["DV-21"]
note = "C++ truncates the output file per archive: only the last archive's tuples survive. Rust opens it once per session: the Rust result is the stdout set of logs-split-var."

[[query]]
id = "wire-cache-topk"
target = "logs.ts"
kql = '*'
outputs = ["results-cache"]
max_num_results = 10
note = "Top 10 by timestamp."

[[query]]
id = "wire-cache-split"
target = "logs.ts-split"
kql = 'level: ERROR'
outputs = ["results-cache"]
max_num_results = 10
divergence = ["DV-25"]
note = "C++ keeps a top-10 per archive (up to 90 documents); Rust keeps a session-wide top-10."

[[query]]
id = "wire-cache-nolog"
target = "search.ts-nolog"
kql = 'level: INFO'
outputs = ["results-cache"]
max_num_results = 10
divergence = ["DV-24"]
note = "Without log order C++ `_id`s collide; Rust derives them from table order."

