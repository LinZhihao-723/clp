# Fixture matrix of the Rust clp-s reader corpus (hand-written; `scripts/build-fixtures.sh` reads
# it). Every entry is compressed by the C++ `clp-s c` from `inputs/<input>` with
# `--single-file-archive` plus `flags`, unless `kind` says otherwise.
#
# * `kind = "sfa"` (default): readable single-file archive(s) at `archives/<name>.clps`, or
#   `archives/<name>.<k>.clps` (k = creation order) when `--target-encoded-size` splits the input.
# * `kind = "kvir"`: the input is an unstructured text log, converted to kv-IR by `log-converter`
#   first; the resulting archive must be readable.
# * `kind = "reject-mfa"`: a multi-file archive directory at `archives/reject/<name>/`.
# * `kind = "reject-sfa"`: a single-file archive at `archives/reject/<name>.clps` that the Rust
#   reader must reject with `UnsupportedArchive` at open time.

