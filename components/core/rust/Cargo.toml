[workspace]
members = [
    "crates/clp-s-arrow",
    "crates/clp-s-cli",
    "crates/clp-s-difftest",
    "crates/clp-s-encoding",
    "crates/clp-s-exec",
    "crates/clp-s-format",
    "crates/clp-s-io",
    "crates/clp-s-json",
    "crates/clp-s-object-store",
    "crates/clp-s-query",
    "crates/clp-s-reader",
    "crates/clp-s-resources",
    "crates/clp-s-results-cache",
    "crates/clp-s-search",
    "crates/clp-s-sinks",
    "crates/clp-s-spider-adapter",
    "crates/clp-s-table",
    "crates/clp-s-timestamp",
    "crates/clp-s-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-buffer = "60.0.0"
arrow-ipc = { version = "60.0.0", default-features = false }
arrow-schema = "60.0.0"
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
bytes = "1.11.1"
clap = { version = "4.6.6", features = ["derive"] }
clp-rust-utils = { path = "../../../components/clp-rust-utils" }
clp-s-arrow = { path = "crates/clp-s-arrow" }
clp-s-difftest = { path = "crates/clp-s-difftest" }
clp-s-encoding = { path = "crates/clp-s-encoding" }
clp-s-exec = { path = "crates/clp-s-exec" }
clp-s-format = { path = "crates/clp-s-format" }
clp-s-io = { path = "crates/clp-s-io" }
clp-s-json = { path = "crates/clp-s-json" }
clp-s-object-store = { path = "crates/clp-s-object-store" }
clp-s-query = { path = "crates/clp-s-query" }
clp-s-reader = { path = "crates/clp-s-reader", default-features = false }
clp-s-resources = { path = "crates/clp-s-resources" }
clp-s-results-cache = { path = "crates/clp-s-results-cache" }
clp-s-search = { path = "crates/clp-s-search" }
clp-s-sinks = { path = "crates/clp-s-sinks" }
clp-s-table = { path = "crates/clp-s-table" }
clp-s-timestamp = { path = "crates/clp-s-timestamp" }
clp-s-wire = { path = "crates/clp-s-wire" }
itoa = "1.0.18"
memchr = "2.8.0"
mongodb = "3.8.0"
non-empty-string = "0.2.6"
parking_lot = "0.12.5"
rmp = "0.8.15"
rmp-serde = "1.3.1"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
spider-core = { git = "https://github.com/y-scope/spider.git", rev = "278d06f81fe0fd0ff62292ee8c6f4cd63a529bfc" }
spider-tdl = { git = "https://github.com/y-scope/spider.git", rev = "278d06f81fe0fd0ff62292ee8c6f4cd63a529bfc", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zerocopy = "0.8.48"
zstd = "0.13.3"
zstd-safe = { version = "7.2.4", features = ["experimental"] }
