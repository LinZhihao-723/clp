[package]
name = "clp-s-reader"
version = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }

[features]
default = ["s3"]
s3 = ["dep:clp-s-object-store"]

[dependencies]
clp-s-exec = { workspace = true }
clp-s-format = { workspace = true }
clp-s-io = { workspace = true }
clp-s-json = { workspace = true }
clp-s-object-store = { workspace = true, optional = true }
clp-s-query = { workspace = true }
clp-s-resources = { workspace = true }
clp-s-search = { workspace = true }
clp-s-table = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
clp-s-object-store = { workspace = true, features = ["test-util"] }
tokio = { workspace = true }
