[package]
name = "clp-s-cli"
version = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "clp-s-rs"
path = "src/main.rs"

[features]
default = ["results-cache", "s3"]
results-cache = ["dep:clp-s-results-cache", "dep:tokio"]
s3 = ["clp-s-reader/s3", "dep:aws-config", "dep:tokio"]

[dependencies]
anyhow = { workspace = true }
aws-config = { workspace = true, optional = true }
clap = { workspace = true }
clp-s-reader = { workspace = true }
clp-s-results-cache = { workspace = true, optional = true }
clp-s-sinks = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
clp-s-difftest = { workspace = true }
clp-s-object-store = { workspace = true, features = ["test-util"] }
mongodb = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
